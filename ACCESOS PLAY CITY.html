<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESOS PLAYCITY - Zitro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <header class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400 flex items-center gap-2">
          <i class="fa-solid fa-file-excel text-emerald-400"></i> ACCESOS PLAYCITY
        </h1>
      </div>
      <div class="bg-slate-700/70 px-4 py-2 rounded-lg border border-slate-600 text-xs text-slate-300 flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="templateStatusText" class="font-semibold text-emerald-300">SUPERVISOR EN LINEA</span>
      </div>
    </header>

    <!-- Parámetros Generales -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800/90 border border-slate-700 p-5 rounded-xl">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Responsable que Tramita</label>
        <input type="text" id="responsableInput" value="Norilebeth Santoy Mena"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Mes Automático Detectado</label>
        <div id="periodoDetectado" class="w-full bg-slate-900 border border-sky-800/70 rounded-lg px-3 py-2 text-sm text-sky-300 font-bold tracking-wide">
          EN ESPERA DE DATOS...
        </div>
        <p class="text-[11px] text-slate-500 mt-1">El mes y año se detectan automáticamente a partir de los días del rol.</p>
      </div>
    </div>

    <div id="validationAlerts" class="hidden rounded-xl border p-4 text-sm"></div>

    <!-- Área de Pegado -->
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-lg space-y-3">
      <div class="flex justify-between items-center">
        <label for="pasteArea" class="font-semibold text-sm text-sky-300 flex items-center gap-2">
          <i class="fa-solid fa-paste"></i> ROL SEMANAL (EXCEL)
        </label>
        <button id="btnLimpiar" class="text-xs text-rose-400 hover:text-rose-300 transition">
          <i class="fa-solid fa-trash-can"></i> Limpiar
        </button>
      </div>
      <textarea id="pasteArea" rows="7" placeholder="Copia el Excel (REGION, NOMBRE DEL PROMOTOR, LUNES..., etc.) y pégalas aquí..." 
                class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-3 text-xs md:text-sm font-mono text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
      
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <button id="btnProcesar" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-gears"></i> Procesar y Generar Archivos con Formato
        </button>
        <button id="btnDescargarTodos" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition active:scale-95 hidden">
          <i class="fa-solid fa-file-zipper"></i> Descargar Todo: Solicitudes + Pausas (.zip)
        </button>
      </div>
    </div>

    <!-- Resultados y Descarga -->
    <div id="resultadosSection" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-list-check text-sky-400"></i> Solicitudes Consolidadas (<span id="totalSalasCount">0</span> salas)
      </h2>
      <div id="cardsSalasContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- Sección de Correo / Lista de Salas para Copiar -->
      <div id="emailCopySection" class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-lg space-y-3 mt-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
          <label class="font-semibold text-sm text-sky-300 flex items-center gap-2">
            <i class="fa-solid fa-envelope-open-text text-amber-400"></i> Texto para Correo / Solicitud:
          </label>
          <button id="btnCopiarTexto" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 active:scale-95 shadow">
            <i class="fa-regular fa-copy"></i> Copiar Texto
          </button>
        </div>
        <textarea id="emailTextArea" rows="12" readonly
                  class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-3 text-xs md:text-sm font-sans text-slate-200 focus:outline-none select-all"></textarea>
      </div>
    </div>

  </div>

    let processedSalasData = {};

    function normalizeStr(str) {
      if (!str) return '';
      return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function normalizeCompact(str) {
      return normalizeStr(str).toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function levenshtein(a, b) {
      a = a || '';
      b = b || '';
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[a.length][b.length];
    }

    function getRegional(regionRaw) {
      const raw = String(regionRaw || '').trim();
      if (!raw) return { ok: false, input: raw };
      const input = normalizeCompact(raw);

      // 1) Alias exacto.
      for (const reg of REGIONALES_CATALOGO) {
        for (const alias of reg.aliases) {
          if (input === normalizeCompact(alias)) return { ok: true, ...reg, fuzzy: false, alias };
        }
      }

      // 2) Tolerancia por contenido para variantes como "REGION CDMX 1".
      for (const reg of REGIONALES_CATALOGO) {
        for (const alias of reg.aliases) {
          const a = normalizeCompact(alias);
          if (a.length >= 4 && (input.includes(a) || a.includes(input))) {
            return { ok: true, ...reg, fuzzy: input !== a, alias };
          }
        }
      }

      // 3) Tolerancia a errores de captura (ej. MONTEREY, GUADALAJRA, PACIFCO).
      let best = null;
      for (const reg of REGIONALES_CATALOGO) {
        for (const alias of reg.aliases) {
          const a = normalizeCompact(alias);
          const distance = levenshtein(input, a);
          const maxLen = Math.max(input.length, a.length) || 1;
          const similarity = 1 - distance / maxLen;
          if (!best || similarity > best.similarity) best = { reg, alias, distance, similarity };
        }
      }
      if (best) {
        const maxLen = Math.max(input.length, normalizeCompact(best.alias).length);
        const allowedDistance = maxLen <= 6 ? 1 : (maxLen <= 12 ? 2 : 3);
        if (best.distance <= allowedDistance && best.similarity >= 0.72) {
          return { ok: true, ...best.reg, fuzzy: true, alias: best.alias, distance: best.distance };
        }
      }
      return { ok: false, input: raw };
    }

    // Coincidencia estricta: primer nombre + al menos un apellido.
    function matchCoordinadora(inputName) {
      if (!inputName) return null;
      const normInput = normalizeStr(inputName);
      const inputTokens = normInput.split(' ').filter(w => w.length > 2);
      if (inputTokens.length < 2) return null;

      for (const coord of COORDINADORAS_LIST) {
        const normCoord = normalizeStr(coord);
        const coordTokens = normCoord.split(' ').filter(w => w.length > 2);
        if (normCoord.includes(normInput) || normInput.includes(normCoord)) return coord;
        if (inputTokens[0] === coordTokens[0]) {
          const remainingInput = inputTokens.slice(1);
          const remainingCoord = coordTokens.slice(1);
          if (remainingInput.some(t => remainingCoord.includes(t))) return coord;
        }
      }
      return null;
    }

    function base64ToUint8Array(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
      return bytes;
    }

    function inicioDelDia(fecha) {
      return new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
    }

    function sumarDias(fecha, dias) {
      const d = inicioDelDia(fecha);
      d.setDate(d.getDate() + dias);
      return d;
    }

    function resolverFechasReales(dayCols) {
      if (!dayCols || dayCols.length === 0) return null;
      const primero = dayCols[0];
      const primerNumero = parseInt(primero.day, 10);
      if (isNaN(primerNumero)) return null;
      const firstWeekIndex = DIAS_ORDEN.indexOf(primero.weekday);
      if (firstWeekIndex < 0) return null;

      const hoy = inicioDelDia(new Date());
      const candidates = [];
      const RADIO = 370;

      for (let offset = -RADIO; offset <= RADIO; offset++) {
        const anchor = sumarDias(hoy, offset);
        if (anchor.getDate() !== primerNumero) continue;
        const jsExpected = firstWeekIndex === 6 ? 0 : firstWeekIndex + 1;
        if (anchor.getDay() !== jsExpected) continue;

        let valid = true;
        const dates = [];
        for (const col of dayCols) {
          const idx = DIAS_ORDEN.indexOf(col.weekday);
          if (idx < 0 || idx < firstWeekIndex) { valid = false; break; }
          const date = sumarDias(anchor, idx - firstWeekIndex);
          if (date.getDate() !== parseInt(col.day, 10)) { valid = false; break; }
          dates.push(date);
        }
        if (valid) candidates.push({ dates, distance: Math.abs(offset), future: offset >= 0 });
      }

      if (!candidates.length) return null;
      candidates.sort((a, b) => a.distance - b.distance || Number(b.future) - Number(a.future));
      return candidates[0].dates;
    }

    function formatoPeriodoDetectado(dayCols) {
      const dates = dayCols.map(d => d.date).filter(d => d instanceof Date);
      if (!dates.length) return 'MES NO DETECTADO';
      const first = dates[0];
      const last = dates[dates.length - 1];
      if (first.getMonth() === last.getMonth() && first.getFullYear() === last.getFullYear()) {
        return `${MESES_NOMBRES[first.getMonth()].toUpperCase()} ${first.getFullYear()}`;
      }
      if (first.getFullYear() === last.getFullYear()) {
        return `${MESES_NOMBRES[first.getMonth()].toUpperCase()} - ${MESES_NOMBRES[last.getMonth()].toUpperCase()} ${last.getFullYear()}`;
      }
      return `${MESES_NOMBRES[first.getMonth()].toUpperCase()} ${first.getFullYear()} - ${MESES_NOMBRES[last.getMonth()].toUpperCase()} ${last.getFullYear()}`;
    }

    function formatDateRange(dayObjects) {
      if (!dayObjects || dayObjects.length === 0) return '';
      const seen = new Set();
      const uniqueDays = [];
      dayObjects.forEach(d => {
        const key = `${d.year}-${d.monthIdx}-${d.day}`;
        if (!seen.has(key)) { seen.add(key); uniqueDays.push(d); }
      });
      const sorted = uniqueDays.sort((a, b) => a.year - b.year || a.monthIdx - b.monthIdx || a.day - b.day);
      if (sorted.length === 1) {
        const d = sorted[0];
        return `El ${d.day} de ${MESES_NOMBRES[d.monthIdx]} del ${d.year}`;
      }
      const sameMonth = sorted.every(d => d.monthIdx === sorted[0].monthIdx && d.year === sorted[0].year);
      if (sameMonth) {
        const monthName = MESES_NOMBRES[sorted[0].monthIdx];
        const year = sorted[0].year;
        const nums = sorted.map(d => d.day);
        const consecutive = nums.every((n, i) => i === 0 || nums[i - 1] + 1 === n);
        if (consecutive) return `Del ${nums[0]} al ${nums[nums.length - 1]} de ${monthName} del ${year}`;
        if (nums.length === 2) return `${nums[0]} y ${nums[1]} de ${monthName} del ${year}`;
        return `${nums.slice(0, -1).join(', ')} y ${nums[nums.length - 1]} de ${monthName} del ${year}`;
      }
      const groups = [];
      sorted.forEach(d => {
        const key = `${d.year}_${d.monthIdx}`;
        let g = groups.find(x => x.key === key);
        if (!g) { g = { key, year: d.year, monthIdx: d.monthIdx, days: [] }; groups.push(g); }
        g.days.push(d.day);
      });
      const parts = groups.map(g => {
        const mName = MESES_NOMBRES[g.monthIdx];
        const cons = g.days.every((n, i) => i === 0 || g.days[i - 1] + 1 === n);
        if (cons && g.days.length > 1) return `del ${g.days[0]} al ${g.days[g.days.length - 1]} de ${mName}`;
        if (g.days.length > 1) return `${g.days.slice(0, -1).join(', ')} y ${g.days[g.days.length - 1]} de ${mName}`;
        return `el ${g.days[0]} de ${mName}`;
      });
      const years = [...new Set(groups.map(g => g.year))];
      return parts.join(' y ') + (years.length === 1 ? ` del ${years[0]}` : ` (${years.join(' / ')})`);
    }

    function parseExcelClipboard(text) {
      const rows = [];
      let currentRow = [], currentField = [], inQuotes = false, i = 0;
      while (i < text.length) {
        const c = text[i];
        if (c === '"') {
          if (inQuotes && i + 1 < text.length && text[i + 1] === '"') { currentField.push('"'); i++; }
          else inQuotes = !inQuotes;
        } else if (c === '\t' && !inQuotes) {
          currentRow.push(currentField.join('').trim()); currentField = [];
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && i + 1 < text.length && text[i + 1] === '\n') i++;
          currentRow.push(currentField.join('').trim()); currentField = [];
          if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
          currentRow = [];
        } else currentField.push(c);
        i++;
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.join('').trim());
        if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
      }
      return rows;
    }

    function extractSchedule(text) {
      const raw = String(text || '').replace(/\r/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
      if (!raw) return null;
      const m = raw.match(/(\d{1,2}):(\d{2})\s*(?:A\s*LAS|A|AL|-)\s*(\d{1,2}):(\d{2})\s*(?:HRS?\.?|HORAS?)?/i);
      if (!m) return null;
      const h1 = Number(m[1]), min1 = Number(m[2]), h2 = Number(m[3]), min2 = Number(m[4]);
      const validTime = (h, min) => h >= 0 && h <= 24 && min >= 0 && min <= 59 && !(h === 24 && min !== 0);
      if (!validTime(h1, min1) || !validTime(h2, min2)) return null;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(h1)}:${pad(min1)} A ${pad(h2)}:${pad(min2)} HRS.`;
    }

    function parseCellAssignment(cellText) {
      if (!cellText) return { sala: null, schedule: null };
      let clean = String(cellText).replace(/\r/g, '').trim();
      const norm = normalizeStr(clean).toUpperCase();
      if (!clean || norm === 'DESCANSO' || norm === 'OFF' || /\bFESTIVO\b/.test(norm)) {
        return { sala: null, schedule: null };
      }

      const schedule = extractSchedule(clean);
      if (schedule) {
        clean = clean.replace(/\d{1,2}:\d{2}\s*(?:A\s*LAS|A|AL|-)\s*\d{1,2}:\d{2}\s*(?:HRS?\.?|HORAS?)?/i, ' ');
      }
      clean = clean.replace(/HORARIO\s+ESPECIAL\s*:?/ig, ' ');
      const salaName = clean.replace(/[:\-\(\)]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
      if (salaName.length < 3) return { sala: null, schedule };
      return { sala: salaName, schedule };
    }

    function modeSchedule(values) {
      const counts = new Map();
      values.filter(Boolean).forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
      let best = null, bestCount = -1;
      for (const [v, c] of counts.entries()) {
        if (c > bestCount) { best = v; bestCount = c; }
      }
      return best;
    }

    function renderValidationAlerts(errors = [], warnings = []) {
      const box = document.getElementById('validationAlerts');
      if (!errors.length && !warnings.length) {
        box.className = 'hidden rounded-xl border p-4 text-sm';
        box.innerHTML = '';
        return;
      }
      const hasErrors = errors.length > 0;
      box.className = `rounded-xl border p-4 text-sm ${hasErrors ? 'bg-rose-950/50 border-rose-700 text-rose-100' : 'bg-amber-950/40 border-amber-700 text-amber-100'}`;
      let html = `<div class="font-bold mb-2"><i class="fa-solid ${hasErrors ? 'fa-triangle-exclamation' : 'fa-circle-info'} mr-1"></i>${hasErrors ? 'Corrige estos datos antes de generar' : 'Avisos de validación'}</div>`;
      if (errors.length) html += `<ul class="list-disc pl-5 space-y-1">${errors.map(e => `<li>${e}</li>`).join('')}</ul>`;
      if (warnings.length) html += `<div class="font-semibold mt-3 mb-1">Avisos:</div><ul class="list-disc pl-5 space-y-1">${warnings.map(w => `<li>${w}</li>`).join('')}</ul>`;
      box.innerHTML = html;
    }

      document.getElementById('pasteArea').value = '';
      document.getElementById('resultadosSection').classList.add('hidden');
      document.getElementById('btnDescargarTodos').classList.add('hidden');
      document.getElementById('emailTextArea').value = '';
      document.getElementById('periodoDetectado').textContent = 'EN ESPERA DE DATOS...';
      renderValidationAlerts([], []);
      processedSalasData = {};
    });

    document.getElementById('btnProcesar').addEventListener('click', () => {
      const rawText = document.getElementById('pasteArea').value.trim();
      if (!rawText) { alert('Por favor pega la información de tu tabla de Excel.'); return; }

      const responsable = document.getElementById('responsableInput').value.trim();
      const lines = parseExcelClipboard(rawText);
      if (lines.length < 2) { alert('El formato pegado no parece tener suficientes filas o columnas.'); return; }

      const errors = [];
      const warnings = [];
      const warningKeys = new Set();

      let headerIdx = -1;
      for (let i = 0; i < lines.length; i++) {
        const rowStr = normalizeStr(lines[i].join(' ')).toUpperCase();
        if (rowStr.includes('PROMOTOR') || DIAS_ORDEN.some(d => rowStr.includes(d))) { headerIdx = i; break; }
      }
      if (headerIdx === -1) { alert('No se pudo detectar la fila de encabezados.'); return; }

      const headers = lines[headerIdx];
      let regionColIdx = -1, promotorColIdx = -1, horarioColIdx = -1;
      const horarioCandidates = [];
      const dayCols = [];

      headers.forEach((h, idx) => {
        const norm = normalizeStr(h).toUpperCase();
        if (norm.includes('REGION') || norm === 'ZONA') regionColIdx = idx;
        else if (norm.includes('PROMOTOR') || norm.includes('NOMBRE DEL PROMOTOR')) promotorColIdx = idx;
        if (norm.includes('HORARIO')) horarioCandidates.push(idx);

        const weekday = nombreDiaDesdeHeader(h);
        if (weekday) {
          const m = String(h).match(/\d{1,2}/);
          if (m) dayCols.push({ colIdx: idx, day: parseInt(m[0], 10), weekday, title: h });
          else warnings.push(`La columna "${h}" parece ser ${weekday}, pero no tiene número de día y no se utilizará.`);
        }
      });

      if (horarioCandidates.length > 0) horarioColIdx = horarioCandidates[horarioCandidates.length - 1];
      if (horarioCandidates.length > 1) warnings.push('Se detectó más de una columna con la palabra HORARIO; se utilizará la última.');
      if (regionColIdx === -1) errors.push('No se encontró la columna REGIÓN/ZONA.');
      if (promotorColIdx === -1) errors.push('No se encontró la columna NOMBRE DEL PROMOTOR.');
      if (dayCols.length === 0) errors.push('No se detectaron columnas de días con número (por ejemplo MARTES 22).');

      dayCols.sort((a, b) => DIAS_ORDEN.indexOf(a.weekday) - DIAS_ORDEN.indexOf(b.weekday));
      const dates = dayCols.length ? resolverFechasReales(dayCols) : null;
      if (dayCols.length && !dates) {
        errors.push('No se pudo relacionar los días del encabezado con una semana real cercana a la fecha actual. Revisa los números de día.');
      } else if (dates) {
        dayCols.forEach((d, i) => {
          d.date = dates[i];
          d.day = dates[i].getDate();
          d.monthIdx = dates[i].getMonth();
          d.year = dates[i].getFullYear();
        });
        document.getElementById('periodoDetectado').textContent = formatoPeriodoDetectado(dayCols);
      }

      if (errors.length) {
        renderValidationAlerts(errors, warnings);
        document.getElementById('resultadosSection').classList.add('hidden');
        document.getElementById('btnDescargarTodos').classList.add('hidden');
        return;
      }

      const salasMap = {};
      const unknownRegions = [];
      const contradictions = [];

      for (let i = headerIdx + 1; i < lines.length; i++) {
        const row = lines[i];
        if (!row || !row.some(c => String(c || '').trim() !== '')) continue;

        const regionRaw = row[regionColIdx] ? String(row[regionColIdx]).trim() : '';
        const promotor = row[promotorColIdx] ? String(row[promotorColIdx]).trim() : '';
        if (!promotor || promotor.length < 2) continue;

        const reg = getRegional(regionRaw);
        if (!reg.ok) {
          unknownRegions.push(`Fila ${i + 1}: región "${regionRaw || '(vacía)'}" de ${promotor} no fue reconocida.`);
          continue;
        }
        if (reg.fuzzy) {
          const key = `${regionRaw}=>${reg.id}`;
          if (!warningKeys.has(key)) {
            warningKeys.add(key);
            warnings.push(`La región "${regionRaw}" se interpretó como ${reg.zona}.`);
          }
        }

        const horarioRaw = horarioColIdx !== -1 && row[horarioColIdx] ? String(row[horarioColIdx]).trim() : '';
        const rowSchedule = extractSchedule(horarioRaw);
        if (horarioRaw && !rowSchedule) {
          const key = `horario:${horarioRaw}`;
          if (!warningKeys.has(key)) {
            warningKeys.add(key);
            warnings.push(`El horario "${horarioRaw}" no tiene formato reconocible. Se intentará usar el horario escrito dentro de las celdas de sala.`);
          }
        }

        dayCols.forEach(dayInfo => {
          const cellRaw = row[dayInfo.colIdx];
          const { sala, schedule: cellSchedule } = parseCellAssignment(cellRaw);
          if (!sala) return;

          if (!salasMap[sala]) {
            salasMap[sala] = {
              displaySala: sala,
              regionId: reg.id,
              region: reg.zona,
              regional: reg,
              regionSources: [{ raw: regionRaw, promotor }],
              promotores: {},
              scheduleAssignments: []
            };
          } else {
            salasMap[sala].regionSources.push({ raw: regionRaw, promotor });
            if (salasMap[sala].regionId !== reg.id) {
              contradictions.push(`La sala ${sala} aparece en ${salasMap[sala].region} y también en ${reg.zona} (${promotor}).`);
            }
          }

          if (!salasMap[sala].promotores[promotor]) salasMap[sala].promotores[promotor] = [];
          salasMap[sala].promotores[promotor].push(dayInfo);

          const effectiveSchedule = cellSchedule || rowSchedule || null;
          salasMap[sala].scheduleAssignments.push({
            promotor,
            dayInfo,
            rowSchedule,
            cellSchedule,
            effectiveSchedule,
            source: cellSchedule ? 'CELDA' : (rowSchedule ? 'COLUMNA' : 'SIN_HORARIO')
          });
        });
      }

      if (unknownRegions.length) errors.push(...unknownRegions);
      if (contradictions.length) errors.push(...[...new Set(contradictions)]);

      const salaNames = Object.keys(salasMap);
      if (!salaNames.length && !errors.length) errors.push('No se detectaron asignaciones de salas válidas en la tabla pegada.');

      if (errors.length) {
        renderValidationAlerts(errors, warnings);
        document.getElementById('resultadosSection').classList.add('hidden');
        document.getElementById('btnDescargarTodos').classList.add('hidden');
        return;
      }

      const container = document.getElementById('cardsSalasContainer');
      container.innerHTML = '';
      processedSalasData = {};
      document.getElementById('totalSalasCount').textContent = salaNames.length;
      document.getElementById('resultadosSection').classList.remove('hidden');
      document.getElementById('btnDescargarTodos').classList.remove('hidden');

      const listaSalasTexto = salaNames.map(s => `• ${s}`).join('\n');
      document.getElementById('emailTextArea').value = `Buena tarde\n\nSu apoyo con la gestión de los accesos adjuntos para las salas\n\n${listaSalasTexto}\n\nSaludos`;

      salaNames.forEach((sala, index) => {
        const data = salasMap[sala];
        const regional = data.regional;

        let todosLosDias = [];
        Object.values(data.promotores).forEach(dias => { todosLosDias = todosLosDias.concat(dias); });
        const periodoGeneral = formatDateRange(todosLosDias);

        const coordinadorasPresentes = [];
        Object.keys(data.promotores).forEach(pNom => {
          const matchedCoord = matchCoordinadora(pNom);
          if (matchedCoord && !coordinadorasPresentes.includes(matchedCoord)) coordinadorasPresentes.push(matchedCoord);
        });

        // HORARIO EFECTIVO DE LA SALA:
        // 1) El horario escrito dentro de la celda del día tiene prioridad.
        // 2) Si la celda no trae horario, se usa la columna HORARIO de esa promotora.
        // 3) Si todas las visitas reales de la sala quedan con el mismo horario, ese horario
        //    se convierte en el horario base y NO se genera una observación redundante.
        // 4) Si existen varios horarios efectivos, se usa el más frecuente como horario base.
        //    En caso de empate se favorece el horario de la columna HORARIO y sólo se anotan
        //    como excepciones los días/promotoras que realmente difieren del horario base.
        const effectiveAssignments = data.scheduleAssignments.filter(x => x.effectiveSchedule);
        const effectiveSchedules = effectiveAssignments.map(x => x.effectiveSchedule);
        const uniqueEffectiveSchedules = [...new Set(effectiveSchedules)];

        let horarioBase = '';
        if (uniqueEffectiveSchedules.length === 1) {
          horarioBase = uniqueEffectiveSchedules[0];
        } else if (uniqueEffectiveSchedules.length > 1) {
          const counts = new Map();
          effectiveSchedules.forEach(s => counts.set(s, (counts.get(s) || 0) + 1));
          const maxCount = Math.max(...counts.values());
          const candidates = [...counts.entries()].filter(([, count]) => count === maxCount).map(([schedule]) => schedule);

          if (candidates.length === 1) {
            horarioBase = candidates[0];
          } else {
            const columnSchedulesInTie = data.scheduleAssignments
              .map(x => x.rowSchedule)
              .filter(s => s && candidates.includes(s));
            horarioBase = modeSchedule(columnSchedulesInTie) || candidates[0];
          }
        }

        if (!horarioBase) {
          const key = `sinHorario:${sala}`;
          if (!warningKeys.has(key)) {
            warningKeys.add(key);
            warnings.push(`La sala ${sala} no tiene ningún horario válido en la columna HORARIO ni dentro de sus celdas. El horario quedará vacío en la solicitud.`);
          }
        }

        const specialByProm = {};
        data.scheduleAssignments.forEach(item => {
          if (!item.effectiveSchedule || !horarioBase || item.effectiveSchedule === horarioBase) return;
          if (!specialByProm[item.promotor]) specialByProm[item.promotor] = {};
          if (!specialByProm[item.promotor][item.effectiveSchedule]) specialByProm[item.promotor][item.effectiveSchedule] = [];
          specialByProm[item.promotor][item.effectiveSchedule].push(item.dayInfo);
        });

        const scheduleNotes = [];
        Object.entries(specialByProm).forEach(([pNom, schedMap]) => {
          Object.entries(schedMap).forEach(([schedText, dList]) => {
            scheduleNotes.push(`La promotora ${pNom} acudirá ${formatDateRange(dList)} en horario ${schedText}`);
          });
        });

        // Regla especial PlayCity CDMX/DF: Norilebeth debe incluirse en cualquier
        // variante reconocida de la región CDMX (CDMX1, CDMX2, CDMXZ1, CDMXZ2,
        // DFZ1, DFZ2, CIUDAD DE MEXICO, etc.). También se toleran etiquetas del rol
        // que contengan explícitamente CDMX o comiencen con DF.
        const requiereNorilebeth = data.regionId === 'CDMX' || (data.regionSources || []).some(src => {
          const compact = normalizeCompact(src.raw || '');
          return compact.includes('CDMX') || compact.startsWith('DF');
        });

        processedSalasData[sala] = {
          sala,
          region: data.region,
          regional,
          periodoGeneral,
          promotores: data.promotores,
          coordinadoras: coordinadorasPresentes,
          requiereNorilebeth,
          responsable,
          horario: horarioBase,
          scheduleNotes,
          // Se conserva el horario efectivo por persona y día para generar
          // automáticamente el segundo archivo de Pausas Activas.
          scheduleAssignments: data.scheduleAssignments.map(x => ({
            promotor: x.promotor,
            dayInfo: x.dayInfo,
            effectiveSchedule: x.effectiveSchedule,
            source: x.source
          }))
        };

        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700 p-4 rounded-xl shadow flex flex-col justify-between hover:border-sky-500/50 transition';

        let promotoresHtml = '';
        Object.entries(data.promotores).forEach(([pNom, pDias]) => {
          const isCoord = matchCoordinadora(pNom);
          const coordTag = isCoord ? '<span class="text-indigo-400 font-semibold ml-1">(Coord)</span>' : '';
          promotoresHtml += `<li class="text-xs text-slate-300 flex justify-between py-1 border-b border-slate-700/50"><span class="font-medium text-slate-200">${pNom} ${coordTag}</span><span class="text-sky-400 font-mono text-[11px]">${formatDateRange(pDias)}</span></li>`;
        });
        promotoresHtml += `<li class="text-xs text-emerald-400 flex justify-between py-1 font-semibold"><span><i class="fa-solid fa-user-shield mr-1"></i> ${regional.nombre} (Regional)</span><span class="text-emerald-300 font-mono text-[11px]">${periodoGeneral}</span></li>`;

        let notesHtml = `<div class="mt-2 p-2 bg-sky-950/40 border border-sky-800/50 rounded text-[11px] text-sky-200"><span class="font-semibold"><i class="fa-solid fa-clock mr-1"></i> Horario efectivo de la sala:</span> ${horarioBase || 'SIN HORARIO DETECTADO'}</div>`;
        if (coordinadorasPresentes.length > 0) {
          notesHtml += `<div class="mt-2 p-2 bg-indigo-950/40 border border-indigo-800/50 rounded text-[11px] text-indigo-200"><span class="font-semibold block mb-0.5"><i class="fa-solid fa-user-gear mr-1"></i> Nota de Coordinación:</span>${coordinadorasPresentes.map(c => `<p>• ${c} es coordinadora y puede presentarse en horario abierto.</p>`).join('')}</div>`;
        }
        if (scheduleNotes.length > 0) {
          notesHtml += `<div class="mt-2 p-2 bg-amber-950/40 border border-amber-800/50 rounded text-[11px] text-amber-200"><span class="font-semibold block mb-0.5"><i class="fa-solid fa-clock mr-1"></i> Horarios Especiales:</span>${scheduleNotes.map(n => `<p>• ${n}</p>`).join('')}</div>`;
        }

        card.innerHTML = `<div><div class="flex justify-between items-start mb-2"><h3 class="font-bold text-sky-300 text-sm tracking-wide">${sala}</h3><span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">${data.region}</span></div><p class="text-xs text-slate-400 mb-2"><i class="fa-regular fa-calendar-days mr-1 text-sky-400"></i> ${periodoGeneral}</p><ul class="space-y-0.5 mb-3">${promotoresHtml}</ul>${notesHtml}</div><button id="btn-descarga-${index}" class="mt-3 w-full bg-slate-700 hover:bg-sky-600 text-white text-xs font-semibold py-2 rounded-lg transition flex items-center justify-center gap-2 active:scale-95"><i class="fa-solid fa-download"></i> Descargar Solicitud + Pausas (.zip)</button>`;
        container.appendChild(card);
        document.getElementById(`btn-descarga-${index}`).addEventListener('click', async () => { await descargarSalaDirecto(sala); });
      });

      renderValidationAlerts([], warnings);
    });

    async function generarBlobParaSala(salaKey) {
      const config = processedSalasData[salaKey];
      if (!config) return null;

      const templateBytes = getTemplateBytes();
      const zip = await JSZip.loadAsync(templateBytes);
      let sheetXml = await zip.file("xl/worksheets/sheet1.xml").async("text");

      // El formato PlayCity usa el nombre de establecimiento sin prefijos de cadena.
      const nombreLimpioSala = config.sala
        .replace(/^PLAY\s*CITY\s+/i, '')
        .replace(/^BIG\s+BOLA\s+/i, '')
        .trim();

      // Campos variables del formato oficial PlayCity.
      // Los demás campos (Proveedor ZITRO, Mercadotecnia, motivo, accesos,
      // materiales, responsable en sala, etc.) se conservan exactamente como
      // vienen en el archivo modelo proporcionado.
      const replacements = {
        'C4': nombreLimpioSala,
        'G5': config.responsable,
        'C10': config.periodoGeneral,
        'G10': config.horario ? config.horario.replace(/ A /g, ' - ').replace(/ HRS\.$/, 'HRS') : ''
      };

      // Limpiar los 20 espacios disponibles para visitantes.
      const visitorCells = [];
      for (let r = 28; r <= 37; r++) visitorCells.push(`B${r}`);
      for (let r = 28; r <= 37; r++) visitorCells.push(`F${r}`);
      visitorCells.forEach(ref => replacements[ref] = '');

      // Misma lógica del generador original: promotores detectados + regional.
      // Si una coordinadora aparece en el rol, ya forma parte de promotores.
      // Para cualquier variante CDMX/DF se agrega además a Norilebeth Santoy Mena.
      const visitantes = Object.keys(config.promotores);
      if (!visitantes.some(n => normalizeStr(n) === normalizeStr(config.regional.nombre))) {
        visitantes.push(`${config.regional.nombre} (Regional)`);
      }
      if (config.requiereNorilebeth && !visitantes.some(n => normalizeStr(n).includes(normalizeStr('Norilebeth Santoy Mena')))) {
        visitantes.push('Norilebeth Santoy Mena (Coordinadora)');
      }

      visitantes.slice(0, visitorCells.length).forEach((nombre, idx) => {
        const esCoord = matchCoordinadora(nombre) || normalizeStr(nombre).includes(normalizeStr('Norilebeth Santoy Mena'));
        let nombreSalida = nombre;
        if (esCoord && !/\(coordinadora\)/i.test(nombreSalida)) nombreSalida += ' (Coordinadora)';
        replacements[visitorCells[idx]] = nombreSalida;
      });

      // Comentarios: la comida/cena se calcula usando el horario efectivo de
      // cada promotor en cada fecha, igual que en su archivo de Pausas Activas.
      // Si todas las visitas comparten la misma comida, basta una leyenda común;
      // de lo contrario se detalla por promotor, fechas y horario de comida.
      const comentarios = [];
      const mealGroups = new Map();
      (config.scheduleAssignments || []).forEach(item => {
        const parsed = parseHorarioCanonico(item.effectiveSchedule);
        if (!parsed) return;
        const mealStart = minutesToHHMM(parsed.start + 180);
        const mealEnd = minutesToHHMM(parsed.start + 240);
        const meal = `${mealStart} a ${mealEnd} hrs.`;
        const key = `${item.promotor}\u0000${meal}`;
        if (!mealGroups.has(key)) mealGroups.set(key, { promotor: item.promotor, meal, dates: [] });
        const group = mealGroups.get(key);
        if (!group.dates.some(d => d.date.getTime() === item.dayInfo.date.getTime())) {
          group.dates.push(item.dayInfo);
        }
      });
      const distinctMeals = [...new Set([...mealGroups.values()].map(x => x.meal))];
      if (distinctMeals.length === 1) {
        comentarios.push(`El horario de comida/cena para las visitas solicitadas es de ${distinctMeals[0]}`);
      } else {
        [...mealGroups.values()].forEach(group => {
          comentarios.push(`El horario de comida/cena de ${group.promotor} ${formatDateRange(group.dates)} es de ${group.meal}`);
        });
      }
      const accesosAbiertos = [`${config.regional.nombre} (Regional)`];
      (config.coordinadoras || []).forEach(c => accesosAbiertos.push(`${c} (Coordinadora)`));
      if (accesosAbiertos.length) {
        comentarios.push(`${accesosAbiertos.join(' y ')} puede asistir en cualquiera de los días establecidos y en horario abierto.`);
      }
      if (config.requiereNorilebeth) {
        comentarios.push('Norilebeth Santoy Mena es coordinadora y puede presentarse en alguno de los días solicitados en horario abierto');
      }
      (config.scheduleNotes || []).forEach(n => comentarios.push(n));
      replacements['B52'] = comentarios.join('\n');

      for (const [cellRef, val] of Object.entries(replacements)) {
        const regex = new RegExp(`<c r="${cellRef}"([^>]*?)(?:>.*?</c>|/>)`, 'g');
        sheetXml = sheetXml.replace(regex, (match, attrs) => {
          const isVisitorCell = visitorCells.includes(cellRef);
          const sMatch = attrs.match(/s="(\d+)"/);
          // En la plantilla PlayCity el estilo 49 corresponde al visitante con
          // relleno amarillo y el 48 al mismo campo sin relleno amarillo.
          // Así, sólo los espacios que realmente contienen un nombre quedan amarillos.
          const styleId = isVisitorCell ? (val ? '49' : '48') : (sMatch ? sMatch[1] : null);
          const sAttr = styleId ? ` s="${styleId}"` : '';
          if (!val) return `<c r="${cellRef}"${sAttr}/>`;
          const cleanVal = String(val)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          const preserve = /^\s|\s$|\n/.test(String(val)) ? ' xml:space="preserve"' : '';
          return `<c r="${cellRef}"${sAttr} t="inlineStr"><is><t${preserve}>${cleanVal}</t></is></c>`;
        });
      }

      zip.file("xl/worksheets/sheet1.xml", sheetXml);
      return await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
    }

    function parseHorarioCanonico(schedule) {
      if (!schedule) return null;
      const m = String(schedule).match(/^(\d{1,2}):(\d{2})\s+A\s+(\d{1,2}):(\d{2})/i);
      if (!m) return null;
      const sh = Number(m[1]), sm = Number(m[2]), eh = Number(m[3]), em = Number(m[4]);
      if (sh > 24 || eh > 24 || sm > 59 || em > 59) return null;
      const start = (sh % 24) * 60 + sm;
      let end = (eh % 24) * 60 + em;
      if (end <= start) end += 24 * 60; // turno que cruza medianoche, incluyendo salida 00:00
      return { start, end };
    }

    function minutesToExcelTime(minutes) {
      const normalized = ((minutes % 1440) + 1440) % 1440;
      return normalized / 1440;
    }

    function minutesToHHMM(minutes) {
      const normalized = ((minutes % 1440) + 1440) % 1440;
      const h = Math.floor(normalized / 60);
      const m = normalized % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function dateToExcelSerial(date) {
      // Excel 1900 date system. Las fechas del rol se crean en hora local; se usa UTC
      // sólo para evitar que el huso horario altere el número de día al serializar.
      const utc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      return utc / 86400000 + 25569;
    }

    function setXmlCellInline(sheetXml, cellRef, value) {
      const regex = new RegExp(`<c r="${cellRef}"([^>]*?)(?:>.*?</c>|/>)`, 'g');
      return sheetXml.replace(regex, (match, attrs) => {
        const sMatch = attrs.match(/s="(\d+)"/);
        const sAttr = sMatch ? ` s="${sMatch[1]}"` : '';
        if (value === null || value === undefined || value === '') return `<c r="${cellRef}"${sAttr}/>`;
        const cleanVal = String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const preserve = /^\s|\s$|\n/.test(String(value)) ? ' xml:space="preserve"' : '';
        return `<c r="${cellRef}"${sAttr} t="inlineStr"><is><t${preserve}>${cleanVal}</t></is></c>`;
      });
    }

    function setXmlCellNumber(sheetXml, cellRef, value) {
      const regex = new RegExp(`<c r="${cellRef}"([^>]*?)(?:>.*?</c>|/>)`, 'g');
      return sheetXml.replace(regex, (match, attrs) => {
        const sMatch = attrs.match(/s="(\d+)"/);
        const sAttr = sMatch ? ` s="${sMatch[1]}"` : '';
        if (value === null || value === undefined || value === '') return `<c r="${cellRef}"${sAttr}/>`;
        return `<c r="${cellRef}"${sAttr}><v>${value}</v></c>`;
      });
    }

    function safeFileName(text) {
      return String(text || '').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    async function generarBlobPausasActivas(salaKey, promotor) {
      const config = processedSalasData[salaKey];
      if (!config) return null;

      const assignments = (config.scheduleAssignments || [])
        .filter(x => x.promotor === promotor && x.effectiveSchedule)
        .sort((a, b) => a.dayInfo.date - b.dayInfo.date);
      if (!assignments.length) return null;

      const zip = await JSZip.loadAsync(getPausasTemplateBytes());
      let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('text');
      const nombreLimpioSala = config.sala.replace(/^PLAY\s*CITY\s+/i, '').replace(/^BIG\s+BOLA\s+/i, '').trim();

      // Encabezado del formato PlayCity de Pausas Activas.
      sheetXml = setXmlCellInline(sheetXml, 'F8', nombreLimpioSala);
      sheetXml = setXmlCellInline(sheetXml, 'N8', 'ZITRO');

      // El formato tiene 9 bloques; una semana normal ocupa como máximo 7 por persona.
      const bases = [12, 18, 24, 30, 36, 42, 48, 54, 60];
      bases.forEach(base => {
        sheetXml = setXmlCellInline(sheetXml, `F${base}`, '');
        sheetXml = setXmlCellInline(sheetXml, `M${base}`, '');
        sheetXml = setXmlCellInline(sheetXml, `C${base + 3}`, '');
        ['F','I','L'].forEach(col => {
          sheetXml = setXmlCellNumber(sheetXml, `${col}${base + 3}`, '');
          sheetXml = setXmlCellNumber(sheetXml, `${col}${base + 4}`, '');
        });
        sheetXml = setXmlCellNumber(sheetXml, `N${base + 4}`, '');
        sheetXml = setXmlCellInline(sheetXml, `P${base + 2}`, '');
      });

      assignments.slice(0, bases.length).forEach((item, idx) => {
        const base = bases[idx];
        const parsed = parseHorarioCanonico(item.effectiveSchedule);
        if (!parsed) return;

        const p1Start = parsed.start + 120;
        const p1End = p1Start + 5;
        const mealStart = parsed.start + 180;
        const mealEnd = mealStart + 60;
        const p3Start = parsed.end - 60;
        const p3End = p3Start + 5;

        sheetXml = setXmlCellInline(sheetXml, `F${base}`, promotor);
        sheetXml = setXmlCellInline(sheetXml, `M${base}`, matchCoordinadora(promotor) ? 'COORDINACIÓN' : 'PROMOTORÍA');
        sheetXml = setXmlCellNumber(sheetXml, `C${base + 3}`, dateToExcelSerial(item.dayInfo.date));
        sheetXml = setXmlCellNumber(sheetXml, `F${base + 3}`, minutesToExcelTime(p1Start));
        sheetXml = setXmlCellNumber(sheetXml, `F${base + 4}`, minutesToExcelTime(p1End));
        sheetXml = setXmlCellNumber(sheetXml, `I${base + 3}`, minutesToExcelTime(mealStart));
        sheetXml = setXmlCellNumber(sheetXml, `I${base + 4}`, minutesToExcelTime(mealEnd));
        sheetXml = setXmlCellNumber(sheetXml, `L${base + 3}`, minutesToExcelTime(p3Start));
        sheetXml = setXmlCellNumber(sheetXml, `L${base + 4}`, minutesToExcelTime(p3End));
        sheetXml = setXmlCellNumber(sheetXml, `N${base + 4}`, minutesToExcelTime(parsed.end));
        sheetXml = setXmlCellInline(sheetXml, `P${base + 2}`,
          `Considerar que su hora de comida/cena es de ${minutesToHHMM(mealStart)} a ${minutesToHHMM(mealEnd)} hrs. (Horario Laboral de ${minutesToHHMM(parsed.start)} a ${minutesToHHMM(parsed.end)} hrs.)`
        );
      });

      zip.file('xl/worksheets/sheet1.xml', sheetXml);
      return await zip.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
    }

    async function generarPaquetesSala(sala) {
      const config = processedSalasData[sala];
      const archivos = [];
      const solicitud = await generarBlobParaSala(sala);
      if (solicitud) archivos.push({ nombre: `${safeFileName(sala)} PROMOTORIA.xlsx`, blob: solicitud });

      // Un archivo de Pausas Activas por colaborador y sala. Regionales o coordinadoras
      // agregadas sólo para acceso abierto no se incluyen porque no tienen turno/día asignado.
      const promotoresConTurno = [...new Set((config.scheduleAssignments || [])
        .filter(x => x.effectiveSchedule)
        .map(x => x.promotor))];
      for (const promotor of promotoresConTurno) {
        const blob = await generarBlobPausasActivas(sala, promotor);
        if (blob) archivos.push({
          nombre: `R-SH-118 Pausas Activas-${safeFileName(sala)}-${safeFileName(promotor)}.xlsx`,
          blob
        });
      }
      return archivos;
    }

    document.getElementById('btnCopiarTexto').addEventListener('click', async () => {
      const text = document.getElementById('emailTextArea').value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('btnCopiarTexto');
        const origHtml = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check text-emerald-300"></i> ¡Copiado!`;
        btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
        setTimeout(() => {
          btn.innerHTML = origHtml;
          btn.classList.replace('bg-emerald-600', 'bg-indigo-600');
        }, 2000);
      } catch (err) {
        const textarea = document.getElementById('emailTextArea');
        textarea.select();
        document.execCommand('copy');
        alert("Texto copiado al portapapeles.");
      }
    });

    async function descargarSalaDirecto(sala) {
      try {
        const archivos = await generarPaquetesSala(sala);
        if (!archivos.length) return;
        const zip = new JSZip();
        archivos.forEach(a => zip.file(a.nombre, a.blob));
        const content = await zip.generateAsync({ type: 'blob' });
        triggerDownload(content, `${safeFileName(sala)} PLAYCITY.zip`);
      } catch (err) {
        console.error("Error generando archivos:", err);
        alert(`Error al generar "${sala}": ${err.message || err}`);
      }
    }

    document.getElementById('btnDescargarTodos').addEventListener('click', async () => {
      const zip = new JSZip();
      const salaNames = Object.keys(processedSalasData);
      
      const btn = document.getElementById('btnDescargarTodos');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generando ZIP...`;
      btn.disabled = true;

      try {
        for (const sala of salaNames) {
          const archivos = await generarPaquetesSala(sala);
          archivos.forEach(a => zip.file(a.nombre, a.blob));
        }
        const content = await zip.generateAsync({ type: "blob" });
        triggerDownload(content, `SOLICITUDES_PLAYCITY_${new Date().toISOString().split('T')[0]}.zip`);
      } catch (err) {
        console.error("Error al generar el ZIP completo:", err);
        alert(`Error al empaquetar ZIP: ${err.message || err}`);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
